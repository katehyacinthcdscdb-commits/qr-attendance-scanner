
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 24px auto;
      padding: 16px;
      text-align: center;
      background: #f5f7fa;
      color: #222;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
    }
    button {
      padding: 12px 18px;
      margin: 8px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    #startBtn { background: #1769aa; color: white; }
    #stopBtn { background: #555; color: white; }
    #status { margin: 16px 0; overflow-wrap: anywhere; }
    #reader { width: 100%; margin: 16px auto; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>QR Attendance Scanner</h2>
    <p>Keep your Apps Script attendance dashboard open in the other tab.</p>

    <div id="status">Ready to start.</div>
    <button id="startBtn" type="button">Start Camera</button>
    <button id="stopBtn" type="button">Stop Camera</button>
    <div id="reader"></div>
  </div>

  <script>
    let scanner = null;
    let scanning = false;
    let processing = false;

    const statusBox = document.getElementById('status');

    function setStatus(message) {
      statusBox.textContent = message;
    }

    async function startScanner() {
      if (scanning) return;

      if (typeof Html5Qrcode === 'undefined') {
        setStatus('Scanner library failed to load. Refresh this page and try again.');
        return;
      }

      try {
        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 240, height: 240 },
            aspectRatio: 1
          },
          async function(decodedText) {
            if (processing) return;
            processing = true;
            console.log('QR CALLBACK FIRED:', decodedText);
            console.log('QR OPENER CHECK:', !!window.opener, window.opener?.closed);

            try {
              try {
                await scanner.stop();
              } catch (stopError) {
                console.warn('Camera already stopped:', stopError.message);
              }
            
              scanning = false;

              if (!window.opener || window.opener.closed) {
                setStatus(
                  'Dashboard connection not found. Open this scanner using the Open QR Scanner button on your Apps Script dashboard.'
                );
                return;
              }
              console.log('SENDING QR MESSAGE:', decodedText);
              window.opener.postMessage(
                {
                  type: 'QR_ATTENDANCE_SCANNED',
                  token: decodedText
                },
                '*'
              );

              setStatus(
                'QR code sent to the dashboard. Check the dashboard for the student details and confirm the transaction.'
              );
            } catch (error) {
              setStatus('Could not send the QR code: ' + error.message);
            }
          },
          function() {
            // Ignore individual frame decode failures.
          }
        );

        scanning = true;
        setStatus('Camera started. Point it at the student QR code.');
      } catch (error) {
        setStatus('Could not start camera: ' + error.message);
      }
    }

    async function stopScanner() {
      if (scanner && scanning) {
        try {
          await scanner.stop();
          scanning = false;
          setStatus('Camera stopped.');
        } catch (error) {
          setStatus('Could not stop camera: ' + error.message);
        }
      }
    }

    document.getElementById('startBtn').addEventListener('click', startScanner);
    document.getElementById('stopBtn').addEventListener('click', stopScanner);
  </script>
</body>
</html>
